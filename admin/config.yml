backend:
  name: github
  repo: TamerSevercan/Vargaz
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "urunler"
    label: "Ürünler"
    folder: "content/urunler"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Formül", name: "formula", widget: "string", required: false}
      - {label: "Açıklama", name: "description", widget: "text", required: false}

  - name: "iletisim"
    label: "İletişim"
    files:
      - file: "content/iletisim"
        label: "İletişim Bilgileri"
        create: true
        slug: "{{slug}}"
        fields:
          - {label: "Adres", name: "address", widget: "text"}
          - {label: "Telefon", name: "phone", widget: "string"}
          - {label: "E-posta", name: "email", widget: "string"}
