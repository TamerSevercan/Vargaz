<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARGAZ | Sınai ve Endüstriyel Gazlar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; }
        header { background: #1e293b; color: #fff; padding: 20px; text-align: center; }
        nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #3b82f6; padding-bottom: 5px; color: #1e293b; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 15px; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; }
        .card h3 { margin-top: 0; color: #2563eb; }
        footer { text-align: center; padding: 20px; background: #1e293b; color: #fff; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>VARGAZ</h1>
        <p>Sınai ve Endüstriyel Gazlar</p>
        <nav>
            <a href="#urunler">Ürünler</a>
            <a href="#hizmetler">Hizmetlerimiz</a>
            <a href="#iletisim">İletişim</a>
            <a href="/admin/">Yönetim Paneli</a>
        </nav>
    </header>

    <div class="container">
        <!-- ÜRÜNLER BÖLÜMÜ -->
        <section id="urunler">
            <h2>Ürünlerimiz</h2>
            <div id="urun-listesi" class="grid">Yükleniyor...</div>
        </section>

        <!-- HİZMETLER BÖLÜMÜ -->
        <section id="hizmetler" style="margin-top: 40px;">
            <h2>Hizmetlerimiz</h2>
            <div id="hizmet-listesi" class="grid">Yükleniyor...</div>
        </section>

        <!-- İLETİŞİM BÖLÜMÜ -->
        <section id="iletisim" style="margin-top: 40px;">
            <h2>İletişim Bilgileri</h2>
            <div id="iletisim-detay">Yükleniyor...</div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 VARGAZ. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        // Frontmatter (YAML) ve İçerik Ayrıştırıcı
        function parseMarkdown(mdText) {
            const parts = mdText.split('---');
            if (parts.length < 3) return { data: {}, body: mdText };
            
            const yamlHeader = parts[1];
            const data = {};

            yamlHeader.split('\n').forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const key = line.substring(0, colonIndex).trim();
                    let val = line.substring(colonIndex + 1).trim();
                    val = val.replace(/^["'](.*)["']$/, '$1');
                    data[key] = val;
                }
            });

            return { data };
        }

        // 1. İLETİŞİM BİLGİLERİNİ ÇEK
        fetch('/content/pages/iletisim.md')
            .then(res => res.text())
            .then(text => {
                const { data } = parseMarkdown(text);
                const html = `
                    <p><strong>Adres:</strong> ${data.address || 'Belirtilmedi'}</p>
                    <p><strong>Telefon:</strong> ${data.phone || 'Belirtilmedi'}</p>
                    <p><strong>E-posta:</strong> ${data.email || 'Belirtilmedi'}</p>
                    <p><strong>Çalışma Saatleri:</strong> ${data.hours || 'Belirtilmedi'}</p>
                `;
                document.getElementById('iletisim-detay').innerHTML = html;
            })
            .catch(() => {
                document.getElementById('iletisim-detay').innerHTML = '<p>İletişim bilgileri henüz girilmedi.</p>';
            });

        // 2. ÜRÜNLERİ GİTİHUB API İLE DİNAMİK ÇEK
        async function urunleriGetir() {
            const repo = "TamerSevercan/Vargaz";
            const apiUrl = `https://api.github.com/repos/${repo}/contents/content/urunler`;
            
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();
                
                const listeDiv = document.getElementById('urun-listesi');
                listeDiv.innerHTML = '';
                
                if (!Array.isArray(files) || files.length === 0) {
                    listeDiv.innerHTML = '<p>Henüz ürün eklenmemiş.</p>';
                    return;
                }

                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        const mdRes = await fetch(file.download_url);
                        const mdText = await mdRes.text();
                        const { data } = parseMarkdown(mdText);
                        
                        const kart = document.createElement('div');
                        kart.className = 'card';
                        kart.innerHTML = `
                            <h3>${data.title || file.name}</h3>
                            <p><strong>Formül:</strong> ${data.formula || '-'}</p>
                            <p>${data.description || ''}</p>
                        `;
                        listeDiv.appendChild(kart);
                    }
                }
            } catch (error) {
                document.getElementById('urun-listesi').innerHTML = '<p>Ürünler yüklenirken bir hata oluştu.</p>';
            }
        }

        urunleriGetir();

        // 3. HİZMETLER İÇİN ÖRNEK ALAN
        document.getElementById('hizmet-listesi').innerHTML = '<div class="card"><h3>Gaz Dolum ve Dağıtım</h3><p>Güvenli ve zamanında teslimat hizmetleri.</p></div>';
    </script>

</body>
</html>
