<form id="contact-form" action="https://formspree.io/f/mvkkveyy" method="POST" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Adınız Soyadınız *</label>
            <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Firma Ünvanı</label>
            <input type="text" name="company" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none">
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">E-posta Adresi *</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Telefon No *</label>
            <input type="tel" name="phone" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none">
        </div>
    </div>

    <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Talep Edilen Gaz Türü</label>
        <select name="gas_type" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none">
            <option>Yük.Saf. Oksijen Gazı (O₂)</option>
            <option>Yük.Saf. Argon Gazı (Ar)</option>
            <option>Yük.Saf. Azot/Nitrojen (N₂)</option>
            <option>Yük.Saf. Karbondioksit (CO₂)</option>
            <option>Yük.Saf. Asetilen (C₂H₂)</option>
            <option>Yük.Saf. Helyum Gaz/Sıvı (He)</option>
            <option>Balon Gazı (He)</option>
            <option>Laboratuvar Gazları</option>
            <option>Gıda Gazları</option>
            <option>Özel Karışım Gazlar</option>
            <option>Emisyon Gazları</option>
        </select>
    </div>

    <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mesajınız & Miktar Detayı *</label>
        <textarea name="message" rows="4" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#3b66c4] text-sm outline-none" placeholder="Tüp sayısı, gaz miktarı veya teknik sorularınız..."></textarea>
    </div>

    <button type="submit" class="w-full py-4 px-6 rounded-xl font-bold text-white bg-[#3b66c4] hover:bg-blue-700 transition-all shadow-lg shadow-blue-500/25">
        Teklif Talebini Gönder
    </button>
</form>
